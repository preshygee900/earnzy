<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnzy - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        :root {
            --primary: #007AFF;
            --secondary: #5856D6;
            --text: #F5F5F7;
            --text-secondary: #A1A1A6;
            --background: #000000;
            --card-bg: rgba(29, 29, 31, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glow: 0 0 20px rgba(0, 122, 255, 0.3);
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #000428, #004e92);
        }

        /* Navigation */
        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-home {
            color: var(--text);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-home:hover {
            color: var(--primary);
        }

        /* Main Content */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-bg);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .form-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Form Switcher */
        .form-switcher {
            display: flex;
            background: var(--glass-bg);
            border-radius: 50px;
            padding: 0.3rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .switcher-btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50px;
            z-index: 1;
        }

        .switcher-btn.active {
            color: var(--text);
        }

        .switcher-indicator {
            position: absolute;
            top: 0.3rem;
            left: 0.3rem;
            height: calc(100% - 0.6rem);
            width: calc(50% - 0.6rem);
            background: var(--primary);
            border-radius: 50px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: var(--glow);
        }

        .switcher-indicator.signup {
            transform: translateX(0);
        }

        .switcher-indicator.login {
            transform: translateX(100%);
        }

        /* Forms */
        .forms-container {
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }

        .form {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .form.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--secondary);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }

        .form-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-secondary);
        }

        .toggle-form {
            color: var(--primary);
            background: none;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-form:hover {
            color: var(--secondary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-bg);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3rem;
            color: #FF9500;
            margin-bottom: 1.5rem;
        }

        .modal h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .modal p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
        }

        .modal-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: var(--primary);
            color: white;
        }

        .modal-btn.primary:hover {
            background: var(--secondary);
            box-shadow: var(--glow);
        }

        .modal-btn.secondary {
            background: var(--glass-bg);
            color: var(--text);
        }

        .modal-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem;
                margin: 1rem;
            }

            .form-header h1 {
                font-size: 1.8rem;
            }

            nav {
                padding: 1rem 5%;
            }

            .container {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }

            .form-header h1 {
                font-size: 1.6rem;
            }

            .switcher-btn {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }

        /* Animation for form inputs */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">Earnzy</div>
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="auth-card">
            <div class="form-header">
                <h1>Welcome to Earnzy</h1>
                <p>Start turning your time into money today</p>
            </div>

            <!-- Form Switcher -->
            <div class="form-switcher">
                <div class="switcher-indicator signup"></div>
                <button class="switcher-btn active" data-form="signup">Sign Up</button>
                <button class="switcher-btn" data-form="login">Log In</button>
            </div>

            <!-- Forms Container -->
            <div class="forms-container">
                <!-- Sign Up Form -->
                <form class="form active" id="signup-form">
                    <div class="form-group">
                        <label class="form-label" for="fullname">Full Name</label>
                        <input type="text" id="fullname" class="form-input" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="package-id">Package ID</label>
                        <input type="text" id="package-id" class="form-input" placeholder="Enter your Package ID" required>
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                    <div class="form-footer">
                        <p>Already have an account? <button type="button" class="toggle-form" data-target="login">Log In</button></p>
                    </div>
                </form>

                <!-- Log In Form -->
                <form class="form" id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Log In</button>
                    <div class="form-footer">
                        <p>Don't have an account? <button type="button" class="toggle-form" data-target="signup">Sign Up</button></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Package ID Modal -->
    <div class="modal-overlay" id="package-modal">
        <div class="modal">
            <div class="modal-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2>Package ID Required</h2>
            <p>You need a valid Package ID to create an account and start earning with Earnzy.</p>
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="modal-cancel">Cancel</button>
                <a href="package.html" class="modal-btn primary">Purchase Package ID</a>
            </div>
        </div>
    </div>

    <script>
        // Form Switcher
        const switcherBtns = document.querySelectorAll('.switcher-btn');
        const forms = document.querySelectorAll('.form');
        const switcherIndicator = document.querySelector('.switcher-indicator');
        const toggleFormBtns = document.querySelectorAll('.toggle-form');

        switcherBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetForm = btn.dataset.form;
                
                // Update switcher buttons
                switcherBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Update indicator position
                switcherIndicator.className = 'switcher-indicator ' + targetForm;
                
                // Show target form
                forms.forEach(form => {
                    form.classList.remove('active');
                    if (form.id === targetForm + '-form') {
                        setTimeout(() => {
                            form.classList.add('active');
                        }, 50);
                    }
                });
            });
        });

        toggleFormBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetForm = btn.dataset.target;
                
                // Find and click the corresponding switcher button
                switcherBtns.forEach(switcherBtn => {
                    if (switcherBtn.dataset.form === targetForm) {
                        switcherBtn.click();
                    }
                });
            });
        });

        // Package ID Modal
        const packageModal = document.getElementById('package-modal');
        const signupForm = document.getElementById('signup-form');
        const packageIdInput = document.getElementById('package-id');
        const modalCancel = document.getElementById('modal-cancel');

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!packageIdInput.value.trim()) {
                // Show shake animation on empty package ID
                packageIdInput.classList.add('shake');
                setTimeout(() => {
                    packageIdInput.classList.remove('shake');
                }, 400);
                
                // Show modal
                packageModal.classList.add('active');
            } else {
                // In a real app, you would submit the form here
                alert('Account created successfully!');
                // For demo purposes, we'll just reset the form
                signupForm.reset();
            }
        });

        // Modal close handlers
        modalCancel.addEventListener('click', () => {
            packageModal.classList.remove('active');
        });

        packageModal.addEventListener('click', (e) => {
            if (e.target === packageModal) {
                packageModal.classList.remove('active');
            }
        });

        // Form input animations
        const formInputs = document.querySelectorAll('.form-input');
        
        formInputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'translateY(0)';
            });
        });

        // Login form handler
        const loginForm = document.getElementById('login-form');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, you would submit the login form here
            alert('Logged in successfully!');
            // For demo purposes, we'll just reset the form
            loginForm.reset();
        });

        // Add subtle background animation
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.auth-card, .modal');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            cards.forEach(card => {
                card.style.transform = `perspective(1000px) rotateX(${y * 2}deg) rotateY(${x * 2}deg)`;
            });
        });
    </script>
</body>
</html>
